name: CI Pipeline

on:
  push:
    branches: [ "master" ]

jobs:
  build-test-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. BUILD (kompilieren)
      - name: Build project
        run: ./gradlew build

      # 2. JUNIT TESTS
      - name: Run tests
        run: ./gradlew test

      # 3. FORMAT CHECK (Spotless)
      - name: Check formatting
        run: ./gradlew spotlessCheck
